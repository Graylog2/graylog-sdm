type = "field_schema"

[query]
description = """
## Overview

The `query` fields describe a name resolution operation performed to obtain resource information associated with a provided name. They represent protocol-agnostic properties of lookup activity that translate names into records, addresses, or related data. The entity defines a normalized structure that captures the essential attributes of resolution behavior independent of transport mechanisms or protocol-specific encodings.

## Design and Usage

The `query` entity models the conceptual characteristics of a lookup request and its corresponding result. It applies to DNS and other name resolution systems that follow a request and response pattern for retrieving resource information. The fields describe the requested name, the category and type of data being sought, the returned values, and the outcome of the resolution process. The model supports consistent interpretation of lookup events even when different protocols implement these semantics differently.

## Common Use Cases

- Monitoring lookup activity to support threat detection and network forensics
- Correlating resolution outcomes with application behavior and connection attempts
- Investigating lookup failures, misconfigurations, or anomalous query patterns

## Implementation Notes

As a top-level entity, `query` defines the complete object representing a single name resolution operation. It should be modeled independently of protocol-specific formats, while remaining compatible with standards such as DNS where applicable. Numeric identifiers and result values may align with DNS conventions, but normalization should reflect conceptual meaning rather than protocol encoding. If additional lookup mechanisms are introduced in the future, corresponding fields should be extended in a manner that maintains clarity and preserves the abstract representation of name resolution activity.
"""

entity_type = "top"

[[query.fields]]
field_suffix = "class"
example_values = "IN"
field_type = "keyword"
description = "Represents the namespace or category associated with the resolution request as defined by the applicable naming system."

[[query.fields]]
field_suffix = "domain"
example_values = "www.example.com"
field_type = "keyword"
description = """
Normalized domain name associated with the query: ASCII-lowercased, with any trailing dot stripped, and punycode labels decoded to Unicode. Illuminate Core's domain enrichment pipeline populates this field from query_request when installed; other event sources or pipelines may populate it independently.
"""

[[query.fields]]
field_suffix = "record_type"
example_values = "A, AAAA, MX, SRV"
field_type = "keyword"
description = "Identifies the type of resource information requested during the lookup operation."

[[query.fields]]
field_suffix = "record_type_code"
example_values = "1, 3, 5"
field_type = "keyword"
description = "Numeric identifier representing the resource record type requested by the lookup."

[[query.fields]]
field_suffix = "registered_domain"
example_values = "example.com"
field_type = "keyword"
description = "Highest registered domain associated with the query, stripped of any subdomain, determined using the public suffix list. For example, the registered domain of \"mail.example.com\" is \"example.com\". Illuminate Core's domain enrichment pipeline populates this field from query_request when installed; other event sources or pipelines may populate it independently."

[[query.fields]]
field_suffix = "request"
example_values = "www.graylog.org"
field_type = "keyword"
description = "Name submitted for resolution during the lookup operation."

[[query.fields]]
field_suffix = "request_length"
example_values = "25"
field_type = "long"
description = "Number of characters contained in the name submitted for resolution."

[[query.fields]]
field_suffix = "response"
example_values = "93.184.216.34"
field_type = "keyword"
description = "Returned resource information associated with the resolved name."

[[query.fields]]
field_suffix = "response_length"
example_values = "25"
field_type = "long"
description = "Number of characters contained in the returned resolution data."

[[query.fields]]
field_suffix = "result"
example_values = "NXDOMAIN, NOERROR"
field_type = "keyword"
description = "Indicates the outcome of the lookup operation."

[[query.fields]]
field_suffix = "result_code"
example_values = "0, 3"
field_type = "keyword"
description = "Numeric identifier representing the outcome of the lookup, aligned with standard resolution result codes."

[[query.fields]]
field_suffix = "subdomain"
example_values = "mail"
field_type = "keyword"
description = "Subdomain portion associated with the query, containing all labels below query_registered_domain, with no trailing period. For example, the subdomain of \"mail.corp.example.com\" is \"mail.corp\". Illuminate Core's domain enrichment pipeline populates this field from query_request when installed; other event sources or pipelines may populate it independently."

[[query.fields]]
field_suffix = "top_level_domain"
example_values = "com"
field_type = "keyword"
description = "Effective top-level domain (eTLD), also known as the domain suffix, associated with the query, determined using the public suffix list. For example, the top-level domain of \"example.co.uk\" is \"co.uk\". Illuminate Core's domain enrichment pipeline populates this field from query_request when installed; other event sources or pipelines may populate it independently."
