type = "field_schema"

[vendor]
description = """
## Overview

The `vendor` fields describe information supplied directly by a product or technology that generated the event. They represent classifications, outcomes, severities, identifiers, and other attributes defined by the originating system to convey context specific to its internal logic or actions. The entity provides a normalized structure for referencing vendor-specific metadata while maintaining consistency across heterogeneous event sources.

## Design and Usage

The `vendor` entity models conceptual properties that originate from a product's own terminology or evaluation processes. Its fields capture descriptive labels, severity ratings, categorizations, and identifiers that reflect how the originating system characterizes the activity being reported. The `vendor_*` fields generally preserve the values provided by the originating system to maintain fidelity with the source data. Normalized fields elsewhere in the schema may represent interpreted or standardized forms of these values, while the `vendor_*` fields retain the product-defined representations used by the event source.

## Common Use Cases

- Preserving vendor-defined descriptions and severity indicators to provide context for alerts and system-generated outcomes
- Enriching normalized event fields with additional detail that reflects the originating product's internal classification or decision logic
- Supporting investigations and analytics that incorporate both normalized and vendor-specific terminology

## Implementation Notes

As a top-level entity, `vendor` represents metadata defined by the originating system and should retain its native values for clarity. The fields within this entity are intended to capture product-specific descriptions without altering their wording or meaning. In cases where source values must be transformed into a standardized format for consistent representation, the transformed form should preserve the conceptual meaning of the original data. If a related normalized field exists elsewhere in the schema, the `vendor` fields may provide complementary detail that maintains fidelity with the source system's semantics.
"""
# Entity types are:
# top: these are top-level fields and should not be assigned as sub-fields
# sub: these are sub-fields, and should be appended to other top-level fields.
entity_type = "top"

#[vendor.meta.plugin_config.MadcapHtmlOutput]
# Define a custom template to use for this schema page.
# This will override the default page setting.
#entity_template_hostname = 'destination_entity_template.j2'
#field_column_order = ["field_suffix", "description", "example_values", "field_type"] 

[[vendor.fields]]
field_suffix = "alert_severity"
example_values = "critical, high, medium, low"
field_type = "keyword"
description = "Vendor-defined textual indicator representing the severity of an alert."

[[vendor.fields]]
field_suffix = "alert_severity_level"
example_values = "4, 3, 2, 1"
field_type = "integer"
description = "Vendor-defined numeric value representing the severity level of an alert."

[[vendor.fields]]
field_suffix = "authentication_provider"
example_values = "Active Directory"
field_type = "keyword"
description = "Vendor-defined value indicating the system or service responsible for validating credentials."

[[vendor.fields]]
field_suffix = "credential_type"
example_values = "password, token"
field_type = "keyword"
description = "Type of credential identified by the originating system."

[[vendor.fields]]
field_suffix = "event_action"
example_values = "allow, deny, pass, fail"
field_type = "keyword"
description = "Vendor-defined label describing the action or behavior represented by the event."

[[vendor.fields]]
field_suffix = "event_category"
example_values = "Removable Media, Registry, File System"
field_type = "keyword"
description = "Category assigned by the originating system to classify the event."

[[vendor.fields]]
field_suffix = "event_description"
example_values = ""
field_type = "keyword"
description = "Vendor-defined descriptive text that provides additional detail about the event action."

[[vendor.fields]]
field_suffix = "event_outcome"
example_values = "block, drop, report, allow, reject"
field_type = "keyword"
description = "Vendor-defined result associated with the action recorded in the event."

[[vendor.fields]]
field_suffix = "event_outcome_reason"
example_values = ""
field_type = "keyword"
description = "Vendor-provided text describing the reason for the reported action or outcome."

[[vendor.fields]]
field_suffix = "event_severity"
example_values = "critical, high, medium, low, informational"
field_type = "keyword"
description = "Vendor-defined textual severity rating for the event."

[[vendor.fields]]
field_suffix = "event_severity_level"
example_values = "0, 1, 5, 10"
field_type = "integer"
description = "Vendor-defined numeric severity rating for the event."

[[vendor.fields]]
field_suffix = "event_timestamp"
example_values = "2024-10-03T07:38:31.407Z"
field_type = "date"
description = "Date and time of the event as defined by the originating system, represented in a standardized date-time format."

[[vendor.fields]]
field_suffix = "private_ip"
example_values = ""
field_type = "ip"
description = "Private network address reported by the originating system."

[[vendor.fields]]
field_suffix = "private_ipv6"
example_values = ""
field_type = "ip"
description = "Private IPv6 address reported by the originating system."

[[vendor.fields]]
field_suffix = "public_ip"
example_values = ""
field_type = "ip"
description = "Public network address reported by the originating system."

[[vendor.fields]]
field_suffix = "public_ipv6"
example_values = ""
field_type = "ip"
description = "Public IPv6 address reported by the originating system."

[[vendor.fields]]
field_suffix = "signin_protocol"
example_values = ""
field_type = "keyword"
description = "Authentication or sign-in protocol identified by the originating system."

[[vendor.fields]]
field_suffix = "subtype"
example_values = "ids, dnsmasq, kernel, threat"
field_type = "keyword"
description = "Vendor-defined subtype that characterizes the specific category or subject of the log message."

[[vendor.fields]]
field_suffix = "threat_suspected"
example_values = ""
field_type = "keyword"
description = "Indicator representing whether the originating system suspects a threat."

[[vendor.fields]]
field_suffix = "transaction_id"
example_values = ""
field_type = "keyword"
description = "Identifier assigned by the originating system to represent a specific transaction or operation."

[[vendor.fields]]
field_suffix = "transaction_type"
example_values = ""
field_type = "keyword"
description = "Type of transaction or operation as defined by the originating system."

[[vendor.fields]]
field_suffix = "user_type"
example_values = ""
field_type = "keyword"
description = "Classification of the user as defined by the originating system."
