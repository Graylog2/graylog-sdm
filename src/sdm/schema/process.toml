#entity_template_hostname = 'destination_entity_template.j2'
#field_column_order = ["field_suffix", "description", "example_values", "field_type"]

[[process.fields]]
field_suffix = "description"
example_values = "WMI Commandline Utility"
field_type = "keyword"
description = "Human-readable description of the executed process."

[[process.fields]]
field_suffix = "command_line"
example_values = "c:\\tmp\\runme.exe, /tmp/runme"
field_type = "keyword/lowercase"
description = "Full command line used to invoke the process."

[[process.fields]]
field_suffix = "command_line_length"
example_values = "29347"
field_type = "long"
description = "Character length of the process command line."

[[process.fields]]
field_suffix = "id"
example_values = "2045,0x3e7"
field_type = "keyword/lowercase"
description = "Numeric process identifier assigned to the executed process."

[[process.fields]]
field_suffix = "integrity_level"
example_values = "medium, high, trusted"
field_type = "keyword"
description = "Security integrity level associated with the executed process."

[[process.fields]]
field_suffix = "parent_command_line"
example_values = "c:\\tmp\\runme.exe, /tmp/runme"
field_type = "keyword/lowercase"
description = "Full command line used to invoke the parent process."

[[process.fields]]
field_suffix = "parent_id"
example_values = "2045,0x3e7"
field_type = "keyword/lowercase"
description = "Numeric process identifier assigned to the parent process."

[[process.fields]]
field_suffix = "parent_name"
example_values = "whoami, whoami.exe"
field_type = "keyword/lowercase"
description = "File name of the parent process, excluding the directory path."

[[process.fields]]
field_suffix = "parent_path"
example_values = "C:\\Windows\\system32\\whoami.exe, /usr/bin/whoami"
field_type = "keyword/lowercase"
description = "Full file system path of the parent process executable."

[[process.fields]]
field_suffix = "parent_uid"
example_values = "{73123815-5caa-4e39-90dc-d25d4013bf15}"
field_type = "keyword"
description = "Unique identifier for the parent process that is distinct from its numeric process identifier."

[[process.fields]]
field_suffix = "name"
example_values = "whoami, whoami.exe"
field_type = "keyword/lowercase"
description = "File name of the executed process, excluding the directory path."

[[process.fields]]
field_suffix = "path"
example_values = "C:\\Windows\\system32\\whoami.exe, /usr/bin/whoami"
field_type = "keyword/lowercase"
description = "Full file system path of the executed process executable."

[[process.fields]]
field_suffix = "target_id"
example_values = "2045,0x3e7"
field_type = "keyword"
description = "Numeric process identifier of the process targeted by an observed action."

[[process.fields]]
field_suffix = "target_name"
example_values = "whoami, whoami.exe"
field_type = "keyword"
description = "File name of the process targeted by an observed action."

[[process.fields]]
field_suffix = "target_path"
example_values = "C:\\Windows\\system32\\whoami.exe, /usr/bin/whoami"
field_type = "keyword"
description = "Full file system path of the process targeted by an observed action."

[[process.fields]]
field_suffix = "target_uid"
example_values = "{73123815-5caa-4e39-90dc-d25d4013bf15}"
field_type = "keyword"
description = "Unique identifier for the process targeted by an observed action."

[[process.fields]]
field_suffix = "uid"
example_values = "{73123815-5caa-4e39-90dc-d25d4013bf15}"
field_type = "keyword"
description = "Unique identifier for the executed process that is distinct from its numeric process identifier."

[[process.fields]]
field_suffix = "working_directory"
example_values = "C:\\Windows\\Temp"
field_type = "keyword"
description = "Current working directory of the executed process."
