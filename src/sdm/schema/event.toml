type = "field_schema"

[event]
description = """
## Overview

The `event` fields represent the core metadata associated with any log message or security event. They describe *when, where, and how* an event occurred — providing the contextual foundation for correlation, sequencing, enrichment, and analytics across diverse log sources.

Each field within the `event` entity captures a specific attribute of the log lifecycle, from when it was generated by the source system to when it was received and processed by a collector or SIEM. These fields serve as the canonical reference for temporal, structural, and contextual normalization across data sources. They also define lifecycle metadata that supports normalization across all other entity types such as `file`, `process`, `user`, and `network`.

## Design and Usage

The `event` fields are **top-level** properties and are not appended to other fields. They are typically populated by the log source, collection agent, or processing pipeline. Key design principles include:

- **Consistency:** Provides a unified event schema across products and log types.
- **Traceability:** Enables end-to-end reconstruction of event flow (source → observer → collector).
- **Temporal accuracy:** Separates creation, start, end, and received times for forensic clarity.
- **Cross-platform support:** Applicable to operating systems, cloud services, applications, and network devices.

## Common Use Cases

- **Correlation and timeline reconstruction** — Use `event_start`, `event_end`, and `event_created` to sequence actions within or across systems.
- **Data provenance tracking** — Combine `event_source`, `event_reporter`, and `event_observer_*` fields to identify the true origin of an event.
- **Severity and outcome analysis** — Use `event_severity` and `event_outcome` for risk scoring, prioritization, and alert tuning.
- **Forensic validation** — Cross-reference `event_code`, `event_id`, and `event_log_name` with vendor documentation or reference databases.

## Implementation Notes

### Event timing

  - `event_created` represents *when the event actually occurred* or was created by the source.
  - `event_received_time` represents *when the event was ingested* by a collector or SIEM.
  - `event_start` and `event_end` provide a temporal range for duration-based activities.
  - `event_sequence` establishes the exact ordering of events where the time fields alone cannot.

### Identifiers

  - `event_code` is numeric (e.g., Windows Event ID), enabling range-based queries.
  - `event_id` is string-based and may include non-numeric vendor identifiers.
  - `event_uid` provides a globally unique reference for deduplication and traceability.

### Observer Fields

The `event_observer_*` fields represent the system that *monitored or inspected* the source (for example, an IDS inspecting network traffic). These distinguish between **event producer** and **event observer** roles in telemetry chains.

## Summary

The `event` entity forms the backbone of the field schema. It defines a consistent, technology-agnostic vocabulary for describing when and where an event occurred, what action took place, how it was reported, and how its severity or outcome should be interpreted. Together, these fields enable accurate correlation, alerting, and investigative workflows across the entire telemetry pipeline.
"""

# Entity types are:
# top: these are top-level fields and should not be assigned as sub-fields
# sub: these are sub-fields, and should be appended to other top-level fields.
entity_type = "top"

#[event.meta.plugin_config.MadcapHtmlOutput]
# Define a custom template to use for this schema page.
# This will override the default page setting.
#entity_template_hostname = 'destination_entity_template.j2'
#field_column_order = ["field_suffix", "description", "example_values", "field_type"] 

[[event.fields]]
field_suffix = "action"
example_values = "blocked, allowed, scan_start, scan_end, scan_pause, scan_cancel, scan_resume"
field_type = "keyword"
description = "Action that was described in a log such as a firewall log or an antivirus agent log."

[[event.fields]]
field_suffix = "code"
example_values = "4624, 1"
field_type = "long"
description = "Numeric event defined by the vendor representing the source message type, e.g. EventCode/Event ID for Microsoft. This field is treated as a numeric value in order to support ranged queries. Any leading 0 values will be removed."

[[event.fields]]
field_suffix = "component"
example_values = "AV engine, firewall module, sensor"
field_type = "keyword"
description = "Subsystem or module of the reporting product that generated the event, such as a specific agent component or engine."

[[event.fields]]
field_suffix = "created"
example_values = "2020-02-20 08:23:15.102, 1602080607"
field_type = "date"
description = "Date/time that the event actually occured or when the original event message was created."

[[event.fields]]
field_suffix = "duration"
example_values = "10293874"
field_type = "long"
description = "Length of time, in seconds, for the event being described."

[[event.fields]]
field_suffix = "end"
example_values = "2021-03-26T11:25:13.113"
field_type = "date"
description = "Date/time that event described in the log message had concluded, usually associated with an event that has a duration."

[[event.fields]]
field_suffix = "error_code"
example_values = "0xC00008"
field_type = "keyword"
description = "Vendor-provided error code associated with the current message."

[[event.fields]]
field_suffix = "error_description"
example_values = "ERROR_ACCESS_DENIED, Not Found"
field_type = "keyword"
description = "Description of error associated with the current message."

[[event.fields]]
field_suffix = "id"
example_values = "0023425, 90EF8"
field_type = "keyword"
description = "Vendor-provided identifier representing a message type. This is similar to event_code but is instead mapped as a lateral string value. Ranged searches are not supported but the ID values will not be modified in any way."

[[event.fields]]
field_suffix = "log_name"
example_values = "security, auth.log"
field_type = "keyword"
description = "Reference to log, such as 'Security', 'auth.log', etc. - this differs from vendor_subtype as it refers more to the original source the log was collected from."

[[event.fields]]
field_suffix = "log_path"
example_values = "/var/log/syslog"
field_type = "keyword"
description = "Full path of log file source."

[[event.fields]]
field_suffix = "observer_hostname"
example_values = "SERVER01.server01.corp.internal"
field_type = "keyword/lowercase"
description = "Hostname or FQDN of a system such as an IDS or IPS that generates an message (such as an alert) based on inspection of a thing, such as network traffic."

[[event.fields]]
field_suffix = "observer_id"
example_values = "234cd78sc"
field_type = "keyword"
description = "Unique ID of the Observer Device, Serial Number, etc."

[[event.fields]]
field_suffix = "observer_ip"
example_values = "10.1.2.3, fe80:5cc3:11:4::2c"
field_type = "ip"
description = "IP address of the event observer."

[[event.fields]]
field_suffix = "observer_uid"
example_values = ""
field_type = "keyword"
description = "Unique identifier (such as a serial number or asset ID) associated with the event observer."

[[event.fields]]
field_suffix = "received_time"
example_values = "2020-02-20 08:00:00, 1602080607"
field_type = "date"
description = "Date/time that the event was received by the reporting host. Normally applicable to logs relayed by a centralized log server."

[[event.fields]]
field_suffix = "repeat_count"
example_values = "5, 3, 9185"
field_type = "long"
description = "Count of times a message has been repeated."

[[event.fields]]
field_suffix = "reporter"
example_values = "SERVER01.server01.corp.internal"
field_type = "keyword"
description = "Hostname or IP for system that delivered the message to Graylog - a WEC server, syslog collector, etc."

[[event.fields]]
field_suffix = "source"
example_values = "LAPTOP01,laptop01.corp.internal"
field_type = "keyword"
description = "Hostname or IP of source system that generated the event."

[[event.fields]]
field_suffix = "source_api_version"
example_values = ""
field_type = "keyword"
description = "API version of source where logs are collected via API."

[[event.fields]]
field_suffix = "source_product"
example_values = "windows, linux, okta"
field_type = "keyword"
description = "System responsible for generating the event, e.g. “windows,” “okta,” etc."

[[event.fields]]
field_suffix = "start"
example_values = "2020-02-20 08:00:00, 1602080607"
field_type = "date"
description = "Beginning time of an event described in a log message, usually associated with an event that has a duration."

[[event.fields]]
field_suffix = "uid"
example_values = "1123523564, 0122e2b3-9923-11ea-ab51-061b68b4ca16"
field_type = "keyword"
description = "Unique identification associated with a single event/message (e.g. “record number” from Windows event logs, a Graylog message ID)."

[[event.fields]]
field_suffix = "outcome"
example_values = "success, failure"
field_type = "keyword"
description = "The outcome (success/failure) of the action described by event_action."

[[event.fields]]
field_suffix = "severity"
example_values = "critical, high, medium, low, informational"
field_type = "keyword"
description = "This will be added by Illuminate Core if only the event_severity_level is defined. This can be mapped from vendor severity levels that do not use the same severity definitions."

[[event.fields]]
field_suffix = "severity_level"
example_values = "1-5"
field_type = "byte"
description = "Numeric representation of the severity rating of the source message: 1 = informational, 2 = low, 3 = medium, 4 = high, 5 = critical. This will be added by Illuminate core when only event_severity is defined."

[[event.fields]]
# Sourced from ECS field `event.sequence` (ECS v9.5.0).
field_suffix = "sequence"
example_values = "1785244658070647447"
field_type = "long"
description = "Sequence number that can be used as a tiebreaker when two or more events share the same timestamp."
