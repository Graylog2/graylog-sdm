type = "field_schema"

[agent]
description = """
## Overview

The `agent` entity represents the software that collects and ships an event into Graylog - such as Graylog's own collector, Beats, or Fluentd - as distinct from the subject of the event itself. The same fields apply more broadly to other kinds of software agents as well, such as EDR/AV clients or management agents (e.g. SCCM), provided the agent in question is the thing responsible for producing or shipping the event rather than the event's subject.

## Design and Usage

Fields describe the identity of the collecting/shipping agent only - never the subject of the event being described. For example, on an event describing an EDR product's own status change, `agent_*` fields identify the software that shipped that event into Graylog, not the EDR product itself; the EDR product's own identity is carried by other fields (such as `event_source_product` or `vendor_*` fields).

This entity also carries a small set of fields specific to Graylog's own collector architecture (fleet and source-routing identifiers, and receiver type).

## Common Use Cases

- Identifying which collector, and which specific installation of that collector, shipped a given event
- Associating an event with the managed fleet a collector instance belongs to
- Associating a collected event with the specific source or receiver configuration within a collector that produced it
- Distinguishing between multiple instances of the same agent software running across an environment, whether that agent is a log collector or another kind of on-host agent

## Implementation Notes

As a top-level entity, agent defines a coherent object representing a single collecting/shipping agent instance. Its fields should be included whenever the software responsible for collecting or shipping an event needs to be identified, independent of whatever entity fields describe the event's actual subject matter.
"""

# Entity types are:
# top: these are top-level fields and should not be assigned as sub-fields
# sub: these are sub-fields, and should be appended to other top-level fields.
entity_type = "top"

[[agent.fields]]
# Sourced from ECS field `agent.build.original` (ECS v9.5.0).
field_suffix = "build_original"
example_values = "otelcol-contrib 0.98.0 (commit 7a9f3c2, built 2024-04-01T10:00:00Z go1.22.1)"
field_type = "keyword"
description = "Extended build information for the agent, in whatever format the source provides (build hash, packaging metadata, etc.)."

[[agent.fields]]
# Sourced from ECS field `agent.ephemeral_id` (ECS v9.5.0).
field_suffix = "ephemeral_id"
example_values = "8a4f500f"
field_type = "keyword"
description = "Ephemeral identifier of the agent. Unlike agent_id, this value changes across restarts of the same agent installation."

[[agent.fields]]
# Graylog-specific field; not sourced from ECS.
field_suffix = "fleet_id"
example_values = "69d91cea0a5d9e8a59eeb24b"
field_type = "keyword"
description = "Unique identifier of the managed fleet/group this agent instance is assigned to."

[[agent.fields]]
# Sourced from ECS field `agent.id` (ECS v9.5.0).
field_suffix = "id"
example_values = "35a4c038-d6ea-433f-8c3c-2d5d5aefaa4f"
field_type = "keyword"
description = "Unique identifier of the agent that collected, shipped, or observed this event (e.g. a Beat's UUID or a custom collector's instance GUID). Persists across restarts of the same agent installation."

[[agent.fields]]
# Sourced from ECS field `agent.name` (ECS v9.5.0).
field_suffix = "name"
example_values = "collector-dc01, filebeat-prod-02, edr-agent-nyc-03"
field_type = "keyword"
description = "Custom, human-readable name assigned to the agent instance. Useful for distinguishing between multiple instances of the same agent type running in an environment."

[[agent.fields]]
# Graylog-specific field; not sourced from ECS.
field_suffix = "receiver_type"
example_values = "file_log"
field_type = "keyword"
description = "Type of receiver/input mechanism that collected this specific event within the agent, as reported by the Graylog Collector (e.g. file_log). For other agent types, this maps to the equivalent underlying concept, such as an OpenTelemetry Collector receiver name."

[[agent.fields]]
# Graylog-specific field; not sourced from ECS.
field_suffix = "source_id"
example_values = "69d91cea0a5d9e8a59ffb24b"
field_type = "keyword"
description = "Identifier associating this agent with a source in Graylog Server's architecture (e.g. a Graylog Input ID). This field is generated by the Graylog Collector; other agent types should only populate this field in situations where the Graylog Collector is not being used to collect the logs in question."

[[agent.fields]]
# Sourced from ECS field `agent.type` (ECS v9.5.0).
field_suffix = "type"
example_values = "auditbeat"
field_type = "keyword"
description = "Type of the agent, constant per product regardless of instance."

[[agent.fields]]
# Sourced from ECS field `agent.version` (ECS v9.5.0).
field_suffix = "version"
example_values = "1.0.0"
field_type = "keyword"
description = "Version of the agent software."
