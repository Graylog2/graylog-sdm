type = "gim"

[database]
name = "database"
code = 15
description = """
The Database category is for events generated by database management systems that record
query execution, data modifications, and schema changes. These events are typically
captured through database audit logs and provide visibility into how data is accessed,
modified, or administered.

Database activity logs are important for monitoring sensitive data access,
detecting suspicious behavior such as mass queries or deletions,
and auditing administrative actions like creating or dropping tables.
They support investigations into data exfiltration, data integrity issues,
and compliance with regulatory requirements.
"""

required_fields = []
recommended_fields = []
optional_fields = []

[database._meta]
validation_file = "database.json"

[[database.summaries]]
#
# See https://github.com/Graylog2/graylog-illuminate-devguide/blob/master/security_features/summary_message_templates.md 
# for information about message summary templates
#
template_id = "database"
title = "Default database template"
description = "Default database template"
summary = "[{gim_event_type}] {source}"

#[[database.indicators]]
#template_id = "indicatorName"
#title = ".."
#description = ".."
#danger = ["value1"]
#success = ["value2"]
#info = ["value3"]
#primary = ["value4"]
#warning = ["value5"]
#default = ["value6"]
#indicator = "field_name"
#default_indicator = "info"

[database.subcategories]

[database.subcategories.00]
name = "query"
description = """
Database query events represent the execution of statements used to retrieve data,
typically SELECT operations. These events capture when a user or process accesses
tables, views, or other database objects in order to read information.

Query events are critical for identifying who accessed sensitive data,
detecting large-scale extraction attempts, and monitoring unusual access patterns
(such as privileged accounts querying tables outside their normal scope).
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "database query"
summary.description = "database query summary"
summary.summary_template = ""
summary.default_indicator = "default"

[database.subcategories.00.event_type_codes]
00.name = "database query"
00.description = "A database query used to retrieve data was executed"


[database.subcategories.05]
name = "update"
description = """
Database update events represent modification of existing rows within a database table,
typically through UPDATE statements. These events capture changes to stored values,
including alterations to sensitive fields such as account information, financial records,
or configuration settings.

Tracking update activity is important for auditing data integrity,
detecting unauthorized changes, and correlating modifications with
the users or applications that performed them.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "database update"
summary.description = "database update summary"
summary.summary_template = "summaryTemplate.database"
summary.default_indicator = "default"

[database.subcategories.05.event_type_codes]
00.name = "update rows"
00.description = "A request to update rows in a database table was made"


[database.subcategories.10]
name = "add"
description = """
Database insert events represent the addition of new rows into a table,
typically through INSERT statements. These events capture the creation of new records
in application data, logs, or system tables.

Insert activity is important for understanding how data enters the system,
tracking the creation of sensitive or high-value records, and detecting anomalies
such as automated bulk inserts or unexpected application behavior.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "database add"
summary.description = "database add data summary"
summary.summary_template = "summaryTemplate.database"
summary.default_indicator = "default"

[database.subcategories.10.event_type_codes]
00.name = "insert rows"
00.description = "A request to insert rows in a database table was made"

01.name = "add table"
01.description = "A request to add a table to a database was made"

02.name = "create database"
02.description = "A request to create a new database was made"


[database.subcategories.15]
name = "delete"
description = """
Database delete events represent the removal of existing rows from a database table,
typically through DELETE statements. These events capture when records are intentionally
erased from a dataset.

Delete activity is important for monitoring potential data destruction,
detecting unauthorized removals, and ensuring compliance with retention policies.
Unusual or large-scale deletions may indicate malicious activity or insider threats.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "database delete"
summary.description = "database delete data summary"
summary.summary_template = "summaryTemplate.database"
summary.default_indicator = "default"

[database.subcategories.15.event_type_codes]
00.name = "delete rows"
00.description = "A request to delete rows from a database table was made"

01.name = "drop table"
01.description = "A request to drop a database table from a database was made"

02.name = "drop database"
02.description = "A request to drop a database was made"


[database.subcategories.99]
name = "default"
description = """
The default subcategory is used for database-related events that do not fit into a more 
specific subcategory such as query, update, insert, or delete. These may include 
vendor-specific messages, system informational logs, or events that lack sufficient detail 
to be classified more precisely. 

This ensures that all database activity can be captured in the model, 
even when normalization is not possible.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "database default"
summary.description = "Messages related to database"
summary.summary_template = "summaryTemplate.database"
#summary.indicator_template = "indicatorTemplate.indicatorName"
summary.default_indicator = "info"

[database.subcategories.99.event_type_codes]
99.name = "database message"
99.description = "Default database message"
