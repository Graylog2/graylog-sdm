type = "gim"

[agent]
name = "agent"
code = 28
description = """
The Agent category includes events generated by software agents that operate autonomously on a system,
such as antivirus clients, endpoint detection and response (EDR) sensors, or management agents.
These agents typically perform monitoring, scanning, update, or remediation actions.
Tracking agent activity helps validate system health, detect tampering, and ensure security services
are functioning as intended.
"""
required_fields = []
recommended_fields = []
optional_fields = ["agent_id", "agent_type", "agent_version"]

[agent._meta]
# Future use - have script generate a validation file to allow testing of output
validation_file = "agent.json"

#[[agent.summaries]]
#template_id = "agentDefault"
#summary = "[{gim_event_type}] event_action:{event_action}"
#title = "agent category template - default"
#description = "Agent category message template"

#[[agent.summaries]]
#template_id = "agentExtended"
#summary = "[{gim_event_type}] event_action:{event_action} | event_outcome: {event_outcome}"
#title = "agent category template - extended"
#description = "Agent category message template for schema v3.1"

[agent.subcategories]

[agent.subcategories.00]
name = "activity"
class = "endpoint"
description = """
Events that describe the operational activity of a system agent, such as scanning, monitoring,
or enforcement actions. These events often include both the performed action and its outcome,
indicating whether the task completed successfully or failed.
"""
required_fields = ["event_action", "event_outcome"]
recommended_fields = []
optional_fields = ["event_component"]

summary.title = "agentActivity"
summary.description = "Agent Activity (schema v3.1)"
summary.summary_template = "[agent.activity] {event_source_product} - event_action:{event_action} | event_outcome:{event_outcome} | event_component:{event_component}"
summary.indicator_template = "indicatorTemplate.eventOutcome"
#summary.default_indicator = "default"

[agent.subcategories.00.event_type_codes]
00.name = "agent activity"
00.description = "General activity performed by a system agent, such as a periodic scan or enforcement action."

01.name = "antivirus or malware scan"
01.description = "A system agent performed a malware or antivirus scan. The event_action field indicates the specific task, and event_outcome indicates success or failure."


[agent.subcategories.01]
name = "update"
class = "endpoint"
description = """
Events that record update activity by a system agent, including updates to signatures,
threat intelligence data, configuration, or the agent software itself.
Monitoring update events helps confirm that agents remain current and functioning correctly.
"""
required_fields = ["event_action", "event_outcome"]
recommended_fields = []
optional_fields = ["event_component"]

# Message Summary configuration
summary.title = "agentUpdateSummary"
summary.description = "Agent Default (schema v3.1)"
summary.summary_template = "[agent.update] {event_source_product} - event_action:{event_action} | event_outcome:{event_outcome} | event_component:{event_component}"
summary.indicator_template = "indicatorTemplate.eventOutcome"
#summary.default_indicator = "default"

[agent.subcategories.01.event_type_codes]
00.name = "agent update"
00.description = "A system agent initiated or completed an update of its configuration, threat intelligence, or software package."


[agent.subcategories.02]
name = "status"
class = "endpoint"
description = """
Events that describe the operational status or health of an agent or one of its components.
Status events typically indicate whether the agent is running, idle, in error, or communicating properly
with its management infrastructure.
"""
required_fields = []
recommended_fields = []
optional_fields = ["event_action", "event_outcome", "event_component"]

summary.title = "agentStatus"
summary.description = "Agent Status (schema v3.1)"
summary.summary_template = "[agent.status] {event_source_product}"
summary.default_indicator = "default"

[agent.subcategories.02.event_type_codes]
00.name = "agent status"
00.description = "An agent reported its current operational status or health state."


[agent.subcategories.99]
name = "default"
class = "endpoint"
description = """
General messages related to agent or component activity that do not fit more specific subcategories.
These may include initialization messages, generic alerts, or vendor-specific telemetry.
"""
required_fields = []
recommended_fields = []
optional_fields = ["event_action", "event_outcome", "event_component"]

summary.title = "agentDefault"
summary.description = "Agent Default (schema v3.1)"
summary.summary_template = "[agent.default] {event_source_product}"
summary.default_indicator = "default"

[agent.subcategories.99.event_type_codes]
99.name = "agent default"
99.description = "Messages related to or from a system agent/function/component."
