type = "gim"

[messaging]
name = "messaging"
code = 13
description = """
The Messaging category is for events generated by email and messaging systems.
It focuses on activities related to the delivery, handling, and filtering of email messages,
such as sending, blocking, rejecting, quarantining, or deleting messages.

These events provide critical visibility into communication flows and security controls.
They are especially important for identifying potential phishing attempts,
tracking message delivery issues, and investigating the handling of suspicious or malicious emails.
"""
required_fields = []
recommended_fields = []
optional_fields = []

[messaging._meta]
validation_file = "messaging.json"

[messaging.subcategories]

[messaging.subcategories.00]
name = "email"
description = """
Email sent events represent attempts to deliver an email message from a source system
or user to a destination. These events capture the act of transmission,
whether successful or failed, and typically include information about
the sender, recipient, and delivery system involved.

They provide visibility into normal email usage as well as
potential abuse, such as bulk sending or unauthorized outbound messages.
"""
required_fields = []
recommended_fields = []
optional_fields = []

# Email summary message view configuration
summary.title = "messaging email"
summary.description = "Messages related to emails being sent"
summary.summary_template = "summaryTemplate.default"
summary.default_indicator = "default"

[messaging.subcategories.00.event_type_codes]
00.name = "email sent"
00.description = "An attempt was made to send an email"


[messaging.subcategories.05]
name = "email"
description = """
Email blocked events represent messages that were prevented from being delivered
by a security control or filtering system. Blocking typically occurs before
the receiving mail server accepts responsibility for the message.

These events are important for identifying the enforcement of spam, phishing,
or malware protections, as well as for verifying that email security policies
are working as intended.
"""
required_fields = []
recommended_fields = []
optional_fields = []

[messaging.subcategories.05.event_type_codes]
00.name = "email blocked"
00.description = "An E-Mail message has been blocked"


[messaging.subcategories.10]
name = "email"
description = """
Email rejected events represent messages that were refused by the receiving mail server
during the delivery process. Unlike blocked messages, which are stopped by a filtering system
before acceptance, rejected messages are actively refused after the sending system attempts delivery.

Common reasons for rejection include invalid recipients, blacklisting, or policy-based rules
(such as rejecting messages from unauthenticated senders). These events are valuable for
troubleshooting delivery issues and for detecting signs of malicious or misconfigured activity.
"""
required_fields = []
recommended_fields = []
optional_fields = []

[messaging.subcategories.10.event_type_codes]
00.name = "email rejected"
00.description = "An e-mail message has been rejected"


[messaging.subcategories.15]
name = "email"
description = """
Email quarantined events represent messages that were delivered to a secure holding area
instead of reaching the intended recipient’s inbox. Quarantine is typically used by
email security gateways or filtering systems to isolate messages suspected of containing
spam, phishing content, or malware.

These events are important for investigations because they indicate suspicious messages
that bypassed outright blocking or rejection but were still prevented from reaching end users.
Analysts may review quarantined messages to confirm malicious content or release them if safe.
"""

required_fields = []
recommended_fields = []
optional_fields = []

[messaging.subcategories.15.event_type_codes]
00.name = "email quarantined"
00.description = "An E-Mail message has been placed into quarantine"


[messaging.subcategories.20]
name = "email"
description = """
Email deleted events represent messages that have been permanently removed
from mail storage. Deletion may occur automatically (for example, by a security
system removing confirmed malicious emails), or manually (by an administrator
or end user).

Tracking deletion events is useful for understanding remediation actions,
enforcing retention policies, and identifying whether suspicious or unwanted
messages were successfully removed from user access.
"""
required_fields = []
recommended_fields = []
optional_fields = []

[messaging.subcategories.20.event_type_codes]
00.name = "email deleted"
00.description = "An E-Mail message has been deleted"


[messaging.subcategories.99]
name = "default"
description = """
The default subcategory is used for email-related events that do not fit into a more
specific subcategory, such as sent, blocked, rejected, quarantined, or deleted.
These may include vendor-specific log messages or generic events that cannot be
reliably classified.

The default subcategory ensures that all email activity is captured within the model,
even when detailed normalization is not possible.
"""
required_fields = []
recommended_fields = []
optional_fields = []

# Messaging default summary message view configuration
summary.title = "messaging default"
summary.description = "Event log messages related to the sending of messages"
summary.summary_template = "summaryTemplate.default"
summary.default_indicator = "default"

[messaging.subcategories.99.event_type_codes]
99.name = "message"
99.description = "E-mail related message"
