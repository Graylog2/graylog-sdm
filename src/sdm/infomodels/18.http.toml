type = "gim"

[http]
name = "http"
code = 18
description = """
The HTTP category is for events that describe web traffic over the Hypertext Transfer Protocol.
These events may be generated by web servers, proxies, firewalls, intrusion detection systems,
or other network and security devices that inspect or record HTTP activity.
They typically capture details such as the request method, URL path, response code, and
the source of the request.

HTTP activity is a critical data source for security monitoring and troubleshooting,
as it provides visibility into user actions, application behavior, and potential
malicious activity such as reconnaissance, exploitation attempts, or data exfiltration.
"""

required_fields = []
recommended_fields = []
optional_fields = []

[http._meta]
# Future use - have script generate a validation file to allow testing of output
validation_file = "http.json"

[http.subcategories]

[http.subcategories.00]
name = "default"
class = "protocol"
description = """
The default HTTP subcategory is used for generic HTTP messages that do not fit into
more specific subcategories such as requests, responses, or proxied communications.
These events typically contain minimal details (such as request method and source)
and act as a fallback to ensure that all HTTP-related activity can be normalized
within the model.
"""
required_fields = ["http_request_method","source_reference"]
recommended_fields = []
optional_fields = []

summary.title = "httpDefault"
summary.description = "HTTP Default Events (schema v3.1)"
summary.summary_template = "[{gim_event_type}] source_reference:{source_reference} | http_request_method:{http_request_method}"
summary.default_indicator = "default"

[http.subcategories.00.event_type_codes]
00.name = "http message"
00.description = "Default http traffic"


[http.subcategories.01]
name = "request"
class = "protocol"
description = """
HTTP request events represent when a client attempts to access a resource on a server
using the Hypertext Transfer Protocol. These events typically include the HTTP method
(e.g., GET, POST), the request path or URI, and the identity of the source making the request.
They provide the foundation for analyzing web activity, such as what resources are being
requested and by whom.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "httpRequest"
summary.description = "HTTP Request Events (schema v3.1)"
summary.summary_template = "[{gim_event_type}] source_reference:{source_reference} | http_request_method:{http_request_method} | http_request_path:{http_request_path}"
summary.default_indicator = "default"

[http.subcategories.01.event_type_codes]
00.name = "http request"
00.description = "HTTP request message"


[http.subcategories.02]
name = "communication"
class = "protocol"
description = """
HTTP communication events represent the complete exchange between a client and server,
typically including both the request and the server's response.
These events are common in logs from firewalls, web servers, IDS/IPS, or proxies
that record both request details (method, path) and response details (status code).
They differ from the 'request' subcategory, which focuses only on the client request,
by including server response context.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "httpCommunication"
summary.description = "HTTP Communication Events (schema v3.1)"
summary.summary_template = "[{gim_event_type}] source_reference:{source_reference} | http_response_code:{http_response_code} | http_request_method:{http_request_method} | http_request_path:{http_request_path}"
summary.default_indicator = "default"

[http.subcategories.02.event_type_codes]
00.name = "http communication"
00.description = "An HTTP request/response transaction was logged, including details such as request method, path, and response code"


[http.subcategories.03]
name = "proxied"
class = "protocol"
description = """
Proxied HTTP events represent communications where an intermediary system (such as a proxy server,
firewall, or web gateway) relays requests and responses between a client and a destination server.
These logs often capture additional context such as the action taken by the proxy (allow, block, or redirect),
the client identity, and the target resource. They are distinct from direct HTTP request/response events
because they describe mediated traffic rather than end-to-end communication.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "httpProxied"
summary.description = "HTTP Proxied Events (schema v3.1)"
summary.summary_template = "[{gim_event_type}] event_action:{event_action} | source_reference:{source_reference} | http_request_method:{http_request_method} | http_request_path:{http_request_path}"
summary.default_indicator = "default"

[http.subcategories.03.event_type_codes]
00.name = "http proxied communication"
00.description = """
An HTTP communication observed at or relayed through a proxy system. This may include requests and responses
logged by forward proxies, reverse proxies, web gateways, or content filters, often with additional metadata
about the proxy’s action (such as allow, block, or redirect).
"""
