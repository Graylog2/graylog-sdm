type = "gim"

[service]
name = "service"
code = 21
description = """
The Service category covers events related to the installation, configuration, and operation of system services or daemons. 
These events indicate when services are started, stopped, installed, removed, enabled, disabled, or reconfigured. 
They are generated by operating systems, service managers (such as Windows SCM or systemd), and security tools monitoring service state changes.
"""
required_fields = ["service_name"]
recommended_fields = []
optional_fields = []

[service._meta]
validation_file = "service.json"

[[service.summaries]]
template_id = "serviceCategory"
summary = "[{gim_event_type}] service_name:{service_name} | user_name:{user_name}"
title = "service category template"
description = "Basic service category message template for schema v3.1"

[[service.indicators]]
type = "serviceStateIndicator"
title = "Service State Indicator"
description = "Set summary font color for different service state events"
danger = [
    "service error",
    "service disabled",
    "service removed",
]
success = [
    "service installed",
    "service enabled",
]
indicator = "gim_event_type"
default_indicator = "info"


[service.subcategories]

[service.subcategories.00]
name = "start"
description = """
Events indicating that a system service or daemon was requested to start. 
These may originate from user actions, process commands, or automated startup routines during system boot. 
The outcome (success or failure) should be represented in the `event_outcome` field, 
not by the event type itself.
"""
class = "endpoint"
required_fields = ["user_name", "event_outcome"]
recommended_fields = []
optional_fields = []

summary.title = "serviceStart"
summary.description = "Service Start Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.serviceCategory"
summary.indicator_template = "indicatorTemplate.serviceStateIndicator"
#summary.default_indicator = "default"

[service.subcategories.00.event_type_codes]
00.name = "service started"
00.description = "An attempt was made to start a system service or daemon, regardless of whether it succeeded."


[service.subcategories.01]
name = "stop"
description = """
Events indicating that a system service or daemon was requested to stop. 
These may result from administrative actions, process terminations, system shutdown sequences, 
or dependency resolution within the operating system's service manager. 
The event type represents the intent to stop the service, while the outcome (success or failure) 
is represented by the `event_outcome` field.
"""
class = "endpoint"
required_fields = ["user_name", "event_outcome"]
recommended_fields = []
optional_fields = []

summary.title = "serviceStop"
summary.description = "Service Stop Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.serviceCategory"
summary.indicator_template = "indicatorTemplate.serviceStateIndicator"
#summary.default_indicator = "default"

[service.subcategories.01.event_type_codes]
00.name = "service stopped"
00.description = "An attempt was made to stop a system service or daemon, regardless of whether it succeeded."


[service.subcategories.10]
name = "configuration"
description = """
Events indicating that a system service or daemon configuration was modified or a change was requested. 
This may include adjustments to startup parameters, dependencies, execution credentials, 
or the service’s run mode (for example, automatic vs. manual start). 
These events describe the intent to alter configuration settings; the `event_outcome` field 
should be used to determine whether the change succeeded or failed.
"""
class = "endpoint"
required_fields = ["user_name", "event_outcome"]
recommended_fields = []
optional_fields = []

summary.title = "serviceConfig"
summary.description = "Service Configuration Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.serviceCategory"
summary.indicator_template = "indicatorTemplate.serviceStateIndicator"
#summary.default_indicator = "default"

[service.subcategories.10.event_type_codes]
00.name = "service configuration change"
00.description = "A configuration change was attempted for a system service or daemon, regardless of whether it succeeded."


[service.subcategories.15]
name = "state"
description = """
Events representing attempts to change the state of a system service or daemon. 
This includes installing or removing a service, as well as enabling or disabling it 
within the operating system’s service management framework. 
The state subcategory captures lifecycle transitions that affect whether a service exists 
or is allowed to run, but not its runtime configuration parameters. 
The `event_outcome` field should indicate whether the state change succeeded or failed.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "serviceState"
summary.description = "Service State Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.serviceCategory"
summary.indicator_template = "indicatorTemplate.serviceStateIndicator"
#summary.default_indicator = "default"

[service.subcategories.15.event_type_codes]
00.name = "service installed"
00.description = "An attempt was made to install or register a system service or daemon."

01.name = "service removed"
01.description = "An attempt was made to remove or unregister a system service or daemon."

02.name = "service enabled"
02.description = "An attempt was made to enable a system service or daemon within the operating system's service manager."

03.name = "service disabled"
03.description = "An attempt was made to disable a system service or daemon within the operating system's service manager."

04.name = "service error"
04.description = "An error occurred while attempting to change the state of a system service or daemon."


[service.subcategories.99]
name = "default"
description = """
A generic category for events related to system services or daemons that do not match a more specific subcategory 
(such as start, stop, configuration, or state). These events may represent vendor-specific messages, 
informational logs, or unclassified service-related activity. 
The default subcategory ensures that all service-related events can be captured even if they cannot be normalized further.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "serviceDefault"
summary.description = "Service Default Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.serviceCategory"
summary.indicator_template = "indicatorTemplate.serviceStateIndicator"
#summary.default_indicator = "default"

[service.subcategories.99.event_type_codes]
99.name = "service message"
99.description = """
A general message related to a system service or daemon that does not map to a more specific subcategory. 
Used as a fallback for unclassified service-related activity.
"""
