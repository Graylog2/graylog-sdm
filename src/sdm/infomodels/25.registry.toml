type = "gim"

[registry]
name = "registry"
code = 25
description = """
The Registry category represents events related to activity within the Windows Registry, 
a hierarchical database that stores configuration data for the operating system and installed applications. 
These events include the creation, modification, deletion, or renaming of registry keys and values. 
Monitoring registry activity is critical for detecting configuration changes, 
policy enforcement modifications, and potential persistence or privilege escalation techniques 
used by attackers. 
This category provides visibility into both administrative and programmatic interactions 
with the registry to support detection, investigation, and change auditing.
"""
required_fields = ["registry_path"]
recommended_fields = []
optional_fields = []

[registry._meta]
validation_file = "registry.json"

[[registry.summaries]]
template_id = "registryCategory"
summary = "[{gim_event_type}] registry_path:{registry_path} | process_path:{process_path} | user_name:{user_name}"
title = "registry category template"
description = "Basic registry category message template for schema v3.1"

[[registry.indicators]]
type = "registryWarningIndicator"
title = "Registry Warning Indicator"
description = "Set font color for registry events of note"
danger = [
    "registry value deleted",
    "registry value modified",
    "registry value set",
]
success = []
indicator = "gim_event_type"
default_indicator = "info"


[registry.subcategories]

[registry.subcategories.00]
name = "value_change"
description = """
The Value Change subcategory represents events where a registry value within a key 
is created, modified, deleted, or overwritten. 
These events provide insight into configuration and policy changes made by the operating system, 
administrators, or software. 
Monitoring value-level changes helps identify both legitimate activity (such as software installation 
or updates) and suspicious behavior that may indicate persistence mechanisms, tampering, or 
security control evasion.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "registryValueChange"
summary.description = "Registry Value Change Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.registryCategory"
summary.indicator_template = "indicatorTemplate.registryWarningIndicator"
#summary.default_indicator = "default"

[registry.subcategories.00.event_type_codes]
00.name = "registry value set"
00.description = """
A Windows registry value was set or overwritten. 
This event occurs when an existing value’s data is updated or replaced, 
often as part of configuration changes or software updates.
"""

01.name = "registry value added"
01.description = """
A new Windows registry value was created within a key. 
This typically occurs when new configuration data is written by an installer, 
application, or script.
"""

02.name = "registry value deleted"
02.description = """
A Windows registry value was deleted from a key. 
This can result from normal cleanup processes, software removal, 
or an attempt to conceal traces of persistence or modification.
"""

03.name = "registry value modified"
03.description = """
An existing Windows registry value was modified. 
This may represent a legitimate configuration change or malicious tampering 
with system or application settings.
"""


[registry.subcategories.05]
name = "key_change"
description = """
The Key Change subcategory represents events where a registry key is created, deleted, or renamed. 
Keys are the structural components of the Windows Registry that organize configuration data into logical paths. 
Monitoring key-level changes helps detect administrative operations, software installation activity, 
or attempts by attackers to establish persistence through new or modified registry locations.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "registryKeyChange"
summary.description = "Registry Key Change Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.registryCategory"
summary.indicator_template = "indicatorTemplate.registryWarningIndicator"
#summary.default_indicator = "default"

[registry.subcategories.05.event_type_codes]
00.name = "registry key added"
00.description = """
A new Windows registry key was created. 
This can occur during software installation, system configuration changes, 
or as part of malicious persistence setup.
"""

01.name = "registry key deleted"
01.description = """
A Windows registry key was deleted. 
This may indicate legitimate cleanup activity, removal of configuration data, 
or attempts to conceal evidence of persistence or modification.
"""

02.name = "registry key renamed"
02.description = """
A Windows registry key was renamed. 
Renaming keys is uncommon in normal system activity and may indicate 
attempts to modify configuration paths or evade detection mechanisms.
"""


[registry.subcategories.10]
name = "object_renamed"
description = """
The Object Renamed subcategory represents events where a registry object—either a key or a value—has been renamed. 
These events are relatively uncommon and typically occur when an application reorganizes configuration data 
or during system updates. 
From a security perspective, registry renames may also indicate attempts to conceal persistence mechanisms, 
rename autostart entries, or obfuscate known registry paths used by malware.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "registryObjectRename"
summary.description = "Registry Object Rename Summary (schema v3.1)"
summary.summary_template = "[{gim_event_type}] registry_path:{registry_path} | registry_path_new:{registry_path_new} | process_path:{process_path} | user_name:{user_name}"
summary.indicator_template = "indicatorTemplate.registryWarningIndicator"
#summary.default_indicator = "default"


[registry.subcategories.10.event_type_codes]
00.name = "registry object renamed"
00.description = """
A Windows registry key or value was renamed. 
Renames are uncommon during normal operation and can occur when configuration data is updated, 
or when malicious software attempts to hide persistence by renaming known registry paths or entries.
"""


[registry.subcategories.99]
name = "default"
description = """
The Default subcategory is used for registry-related events that do not fit within more specific 
categories such as key changes, value modifications, or object renames. 
This ensures that all registry activity can be captured and normalized, even when the event details 
do not clearly specify the nature of the registry operation. 
These events often originate from vendor-specific or generic audit sources with limited context.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "registryDefault"
summary.description = "Registry Default Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.registryCategory"
summary.indicator_template = "indicatorTemplate.registryWarningIndicator"
#summary.default_indicator = "default"

[registry.subcategories.99.event_type_codes]
99.name = "registry event"
99.description = """
A generic Windows registry event that does not fit within more specific registry subcategories. 
These events may provide limited detail about the registry operation but are retained to maintain 
visibility into all registry-related activity.
"""
