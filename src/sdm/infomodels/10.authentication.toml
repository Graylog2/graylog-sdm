type = "gim"

[authentication]
name = "authentication"
code = 10
description = """
The authentication category covers events where accounts or services attempt to access, validate, or terminate sessions on a system.
This includes, but is not limited to, logon activity, credential validation, and related events such as logoff, Kerberos requests, or policy checks.
Authentication events in this category are account-centric: each event must identify a user or service account (`user_name`) and the application or system (`application_name`) where the activity occurred.
"""
required_fields = ["application_name", "user_name"]
recommended_fields = []
optional_fields = []

[authentication._meta]
validation_file = "authentication.json"

#[[authentication.summaries]]
#template_id = "authBasic"
#title = "Basic Authentication Message Summary Template"
#description = "Summarize basic authentication messages"
#summary = "[category:{gim_event_category}] user_name:{user_name} | event_outcome:{event_outcome}"

#[[authentication.summaries]]
#template_id = "authExtended"
#title = "Extended Authentication Message Summary Template"
