type = "gim"

[driver]
name = "driver"
code = 27
description = """
The Driver category captures events related to system driver management, including loading, unloading,
and configuration changes. Drivers operate with high privileges and interact directly with the operating system kernel,
making driver events highly relevant for detecting unauthorized code execution, persistence mechanisms,
or system integrity violations. This category supports monitoring of driver lifecycle activity across
different operating systems.
"""
required_fields = []
recommended_fields = []
optional_fields = []

[driver._meta]
validation_file = "driver.json"

[[driver.summaries]]
template_id = "driverCategoryTemplate"
summary = "[{gim_event_type}] event_action:{event_action} | user_name:{user_name}"
title = "driver category template"
description = "Basic driver category message template for schema v3.1"

[[driver.indicators]]
type = "driverWarningIndicator"
title = "Driver Warning Indicator"
description = "Set font color for driver events of note"
danger = ["system driver loaded"]
success = []
indicator = "gim_event_type"
default_indicator = "info"

[driver.subcategories]

[driver.subcategories.00]
name = "loaded"
description = """
Events that record when a system driver is loaded into memory. 
Driver loading typically occurs during system startup or device initialization, 
but unexpected or unsigned driver loads may indicate tampering or malicious kernel activity.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "driverLoaded"
summary.description = "Driver Loaded Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.driverCategoryTemplate"
summary.indicator_template = "indicatorTemplate.driverWarningIndicator"
#summary.default_indicator = "default"

[driver.subcategories.00.event_type_codes]
00.name = "system driver loaded"
00.description = "A system driver was loaded into memory, either during startup or through a manual or automated process."


[driver.subcategories.01]
name = "unloaded"
description = """
Events that record when a system driver is unloaded from memory. 
While driver unloads can be part of normal device lifecycle operations, 
frequent or unexpected unloads may indicate troubleshooting activity or driver manipulation attempts.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "driverUnloaded"
summary.description = "Driver Unloaded Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.driverCategoryTemplate"
summary.default_indicator = "default"

[driver.subcategories.01.event_type_codes]
00.name = "system driver unloaded"
00.description = "A system driver was unloaded from memory, either as part of normal operation or manual intervention."


[driver.subcategories.99]
name = "default"
description = """
General events related to system drivers that do not fit more specific subcategories.
These may include driver configuration messages, version reports, or unsigned driver alerts.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "driverDefault"
summary.description = "Driver Unloaded Summary (schema v3.1)"
summary.summary_template = "summaryTemplate.driverCategoryTemplate"
summary.default_indicator = "default"

[driver.subcategories.99.event_type_codes]
99.name = "system driver event"
99.description = "Messages related to system driver configuration"
