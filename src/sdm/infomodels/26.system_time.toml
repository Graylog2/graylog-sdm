type = "gim"

[system_time]
name = "system_time"
code = 26
description = """
The System Time category captures events where the system clock is modified, either manually or automatically. 
System time integrity is critical for maintaining reliable event sequencing and forensic accuracy. 
Changes to the system clock may occur through legitimate synchronization mechanisms (such as NTP or domain time sync) 
or as the result of administrative action or malicious tampering.
"""
required_fields = [ "source", "user_name" ]
recommended_fields = []
optional_fields = []

[system_time._meta]
validation_file = "system_time.json"

#[[system_time.summaries]]
#
# See https://github.com/Graylog2/graylog-illuminate-devguide/blob/master/security_features/summary_message_templates.md 
# for information about message summary templates
#
#template_id = "templateName"
#title = ".."
#description = ".."
#summary = "[{gim_event_type}]"

#[[system_time.indicators]]
#type = "indicatorName"
#title = ".."
#description = ".."
#danger = ["value1"]
#success = ["value2"]
#info = ["value3"]
#primary = ["value4"]
#warning = ["value5"]
#default = ["value6"]
#indicator = "field_name"
#default_indicator = "info"

[system_time.subcategories]

[system_time.subcategories.00]
name = "time_change"
description = """
Events that record changes to the system clock, whether performed manually by a user or automatically
by synchronization services such as NTP or domain time synchronization. Monitoring these changes is
essential for maintaining forensic integrity and ensuring accurate event correlation.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "systemTimeChange"
summary.description = "System Time - Time Change Events (schema v3.1)"
summary.summary_template = "[system_time.time_change] user_name:{user_name}"
summary.default_indicator = "default"

[system_time.subcategories.00.event_type_codes]
00.name = "system time changed"
00.description = "The system clock was changed, either manually by a user or automatically by a synchronization service."


