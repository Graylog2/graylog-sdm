type = "gim"

[process]
name = "process"
code = 19
description = """
The Process category covers events related to the lifecycle and behavior of processes on a system.
This includes process creation and termination, inter-process interactions such as access or remote
thread injection, and modifications to running processes. These events are commonly generated by
operating system auditing features and endpoint detection and response (EDR) tools, and they are
critical for detecting malicious activity such as unauthorized execution, privilege escalation, or code injection.
"""
required_fields = ["process_name", "user_name"]
recommended_fields = ["process_parent_name"]
optional_fields = ["process_command_line"]

[process._meta]
validation_file = "process.json"

[[process.indicators]]
type = "processActionIndicator"
title = "Process Action Indicator"
description = "Set summary font color for different service state events"
danger = ["process altered"]
default = []
info = []
primary = []
success = []
warning = []
indicator = "gim_event_type"
default_indicator = "info"

[process.subcategories]

[process.subcategories.00]
name = "execute"
description = """
Execute events represent the creation of a new process on a system. 
They typically capture the process name, the user context under which the process was launched, 
and the parent process that initiated the execution. These events are fundamental for tracking 
program execution, detecting suspicious launches, and establishing parent-child process relationships 
during investigations.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "processExecuteSummary"
summary.description = "Process Execute Summary (schema v3.1)"
summary.summary_template = "[{gim_event_type}] process_name:{process_name} | user_name:{user_name} | process_parent_path:{process_parent_path}"
summary.default_indicator = "default"

[process.subcategories.00.event_type_codes]
00.name = "process started"
00.description = "An attempt to start a process has made on a system"

[process.subcategories.01]
name = "end"
description = """
End events represent the termination of a running process on a system. 
These events may result from normal activity (such as an application closing) or from 
administrative or security actions (such as task termination or killing a malicious process). 
They are important for correlating process execution lifecycles and identifying 
suspicious or unexpected terminations.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "processEndSummary"
summary.description = "Process End Summary (schema v3.1)"
summary.summary_template = "[{gim_event_type}] process_name:{process_name} | user_name:{user_name}"
summary.default_indicator = "default"

[process.subcategories.01.event_type_codes]
00.name = "process stopped"
00.description = "An attempt to terminate a running process has been made"

[process.subcategories.05]
name = "interaction"
description = """
Interaction events represent one process attempting to access or manipulate another process. 
This may include actions such as opening a handle, reading or writing memory, or injecting a thread. 
These events are high-value indicators of potentially malicious behavior, as they are often associated 
with techniques like credential dumping, code injection, or process hollowing.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "processInteractionSummary"
summary.description = "Process Interaction Summary (schema v3.1)"
summary.summary_template = "[{gim_event_type}] event_action:{event_action} | process_name:{process_name} | process_target_name:{process_target_name} | user_name:{user_name}"
summary.default_indicator = "default"

[process.subcategories.05.event_type_codes]
00.name = "process accessed"
00.description = "A process attempted to access another running process (for example, opening a handle to inspect or manipulate it)."

01.name = "remote thread created"
01.description = "A process attempted to create a thread in the address space of another process."

[process.subcategories.10]
name = "action"
description = """
Action events represent modifications to an already-running process. 
This can include loading additional modules (such as DLLs) or altering the process state 
through techniques like code injection. These events are important for detecting 
tampering, persistence mechanisms, or malicious manipulation of legitimate processes.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "processActionSummary"
summary.description = "Process Action Summary (schema v3.1)"
summary.summary_template = "[{gim_event_type}] process_name:{process_name} | event_action:{event_action} | user_name:{user_name}"
summary.indicator_template = "indicatorTemplate.processActionIndicator"
#summary.default_indicator = "default"

[process.subcategories.10.event_type_codes]
00.name = "process altered"
00.description = "A running process was modified in some way (for example, through code injection or tampering)."

01.name = "image loaded"
01.description = "A module (such as a DLL) was loaded into a running process."

[process.subcategories.99]
name = "default"
description = """
The default subcategory is used for process-related events that do not match a more specific subcategory, 
such as execution, termination, interaction, or modification. It ensures that all process events can be captured, 
even if they cannot be consistently classified.
"""
class = "endpoint"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "processDefaultSummary"
summary.description = "Process Default Summary (schema v3.1)"
summary.summary_template = "[{gim_event_type}] process_name:{process_name} | user_name:{user_name}"
summary.default_indicator = "default"

[process.subcategories.99.event_type_codes]
90.name = "process message"
90.description = "A generic process-related event that does not map to a more specific subcategory or event type."
