type = "gim"

[detection]
name = "detection"
code = 30
description = """
The Detection category represents findings generated by security products that identify potential 
malicious or policy-violating activity. These events originate from technologies such as intrusion 
detection and prevention systems (IDS/IPS), endpoint protection platforms (EPP/EDR), data loss 
prevention tools (DLP), and file integrity monitors (FIM). 

Detections differ from SIEM alerts in that they are created by external security controls and 
represent observed conditions or rule matches at the source system. Monitoring these detections 
enables correlation across multiple technologies and supports threat hunting, incident triage, 
and long-term analytics.
"""
required_fields = []
recommended_fields = []
optional_fields = []

[detection._meta]
validation_file = "detection.json"

#[[detection.summaries]]
#
# See https://github.com/Graylog2/graylog-illuminate-devguide/blob/master/security_features/summary_message_templates.md 
# for information about message summary templates
#
#template_id = "templateName"
#title = ".."
#description = ".."
#summary = "[{gim_event_type}]"

#[[detection.summaries]]
#template_id = "Detection"
#summary = "[{gim_event_type}] {event_source_product} detection:{alert_signature} severity:{alert_severity}"
#title = "Detection"
#description = "Basic detection summary template"

#[[detection.indicators]]
#type = "indicatorName"
#title = ".."
#description = ".."
#danger = ["value1"]
#success = ["value2"]
#info = ["value3"]
#primary = ["value4"]
#warning = ["value5"]
#default = ["value6"]
#indicator = "field_name"
#default_indicator = "info"
[[detection.indicators]]
type = "detectionPrimary"
title = "Primary Detection Indicator"
description = "Primary detection indicator template"
success = []
danger = ["critical"]
indicator = "alert_severity"
default_indicator = "info"

[detection.subcategories]

[detection.subcategories.00]
name = "network_detection"
description = """
Detections generated by network-based security controls such as intrusion detection or prevention systems (IDS/IPS), 
firewalls with inspection capabilities, network DLP systems, or packet inspection tools. These detections identify 
suspicious or policy-violating activity within network traffic, typically based on signatures, behavioral heuristics, 
or data exfiltration patterns.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "detection network detection"
summary.description = "Network detection summary"
summary.summary_template = "[network_detection] {event_source_product} detection:{alert_signature} severity:{alert_severity} from source_reference:{source_reference} to destination_reference:{destination_reference}"
summary.indicator_template = "indicatorTemplate.detectionPrimary"


[detection.subcategories.00.event_type_codes]
00.name = "ids_detection"
00.description = "A detection message generated by a network intrusion detection or prevention system (IDS/IPS)."

01.name = "network_detection"
01.description = "A detection message generated by a network traffic inspection or analytics product."

02.name = "network_dlp_detection"
02.description = "A detection message generated by a network data loss prevention (DLP) product."


[detection.subcategories.10]
name = "host_detection"
description = """
Detections generated by endpoint or host-based security agents such as antivirus, EDR, HIPS, or DLP products. 
These events indicate that a host-level control detected potentially malicious, suspicious, or policy-violating 
activity. They often include contextual data such as the affected process, file, user, or registry object.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "detection host detection"
summary.description = "Host detection summary"
summary.summary_template = "[host_detection] {event_source_product} detection:{alert_signature} severity:{alert_severity} on host_reference:{host_reference}"
summary.indicator_template = "indicatorTemplate.detectionPrimary"

[detection.subcategories.10.event_type_codes]
00.name = "host_malware_detection"
00.description = "Detection message generated by a host-based antivirus or malware protection component."

01.name = "host_dlp_detection"
01.description = "Detection message generated by a host-based data loss prevention component."

02.name = "hips_detection"
02.description = "Detection message generated by a host intrusion prevention or detection system (HIPS/HIDS)."

03.name = "fim_detection"
03.description = "Detection message generated by a file integrity monitoring (FIM) product."


[detection.subcategories.99]
name = "default"
description = """
General detection events that do not fit into a more specific category, such as detections from 
aggregate analytics, correlation engines, or vendor-agnostic detection frameworks. This ensures 
all externally generated detection messages are captured, even when detailed classification is not available.
"""
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "detection default"
summary.description = "Default detection summary"
summary.summary_template = "[detection] {event_source_product} detection:{alert_signature} severity:{alert_severity}"
summary.indicator_template = "indicatorTemplate.detectionPrimary"

[detection.subcategories.99.event_type_codes]
99.name = "detection_message"
99.description = "Generic detection event generated by an external security control or analytic system."
