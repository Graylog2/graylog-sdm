type = "gim"

[alert]
name = "alert"
code = 17
description = "This category has been deprecated and is being replaced by the new detection category. This category will be removed in Illuminate 7.0."
required_fields = []
recommended_fields = []
optional_fields = []

[alert._meta]
validation_file = "alert.json"

#[[alert.summaries]]
#
# See https://github.com/Graylog2/graylog-illuminate-devguide/blob/master/security_features/summary_message_templates.md 
# for information about message summary templates
#
#template_id = "templateName"
#title = ".."
#description = ".."
#summary = "[{gim_event_type}]"

#[[alert.summaries]]
#template_id = "Alert"
#summary = "[{gim_event_type}] {event_source_product} alert:{alert_signature} severity:{alert_severity}"
#title = "Alert"
#description = "Basic alerting summary template"

#[[alert.indicators]]
#type = "indicatorName"
#title = ".."
#description = ".."
#danger = ["value1"]
#success = ["value2"]
#info = ["value3"]
#primary = ["value4"]
#warning = ["value5"]
#default = ["value6"]
#indicator = "field_name"
#default_indicator = "info"
[[alert.indicators]]
type = "alertPrimary"
title = "Primary Alert"
description = "Primary alert indicator template"
danger = ["critical"]
warning = ["high"]
primary = ["medium"]
success = ["low"]
info = ["informational"]
indicator = "alert_severity"
default_indicator = "info"

[alert.subcategories]

[alert.subcategories.00]
name = "network alert"
description = "Alerts detected related to network traffic, where two systems are communicating"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "alert network alert"
summary.description = "Network alert summary"
summary.summary_template = "[{gim_event_type}] {event_source_product} alert:{alert_signature} severity:{alert_severity} from source_reference:{source_reference} to destination_reference:{destination_reference}"
summary.indicator_template = "indicatorTemplate.alertPrimary"


[alert.subcategories.00.event_type_codes]
00.name = "ids alert"
00.description = "Alert generated by an intrusion detection or prevention product"
01.name = "network alert"
01.description = "Alert generated by a product that monitors or manages network traffic"
02.name = "network dlp alert"
02.description = "Alert generated by a data loss detection/prevention product"


[alert.subcategories.10]
name = "host alert"
description = "Alerts generated by a product that monitors host activity"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "alert host alert"
summary.description = "Host alert summary"
summary.summary_template = "[{gim_event_type}] {event_source_product} alert:{alert_signature} severity:{alert_severity} on host_reference:{host_reference}"
summary.indicator_template = "indicatorTemplate.alertPrimary"

[alert.subcategories.10.event_type_codes]
00.name = "malware alert"
00.description = "Alert generated by a product that detects malicious software"
01.name = "host dlp alert"
01.description = "Alert generated by a product that scans a host for sensitive information"
02.name = "hips alert"
02.description = "Alert generated by a product that detects/prevents potentially malicious activity on a system"
03.name = "fim alert"
03.description = "Alert generated by a product that monitors file integrity"


[alert.subcategories.99]
name = "default"
description = "alert messages"
required_fields = []
recommended_fields = []
optional_fields = []

summary.title = "alert default"
summary.description = "Default alert summary"
summary.summary_template = "[alert.default] {event_source_product} alert:{alert_signature} severity:{alert_severity}"
summary.indicator_template = "indicatorTemplate.alertPrimary"

[alert.subcategories.99.event_type_codes]
99.name = "alert message"
99.description = "Alert messages generated by an external source"