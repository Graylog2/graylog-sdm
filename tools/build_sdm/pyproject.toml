[project]
name = "build-gim"
version = "0.1.0"
description = "Builds Graylog Information Model (GIM) schema, config, and documentation artifacts from _meta/gim source files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.12.0",
    "pydantic>=1.10,<2.0",
    "jinja2>=3.1",
    "markdown>=3.4",
    "pytest-mock>=3.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

# This is the first time ruff has run against this tree. Everything below is
# pre-existing code, grandfathered wholesale (not just the newly-added stricter
# rules) so the first run is clean; only output_plugins/field_mapping_csv_output/
# and its tests are held to the full standard.
extend-exclude = [
    "main.py",
    "runner.py",
    "config_loader.py",
    "plugin_loader.py",
    "base_output.py",
    "gim_schema/atomic_fields.py",
    "gim_schema/field_schema_model.py",
    "gim_schema/full_schema.py",
    "gim_schema/plugin_config_schema.py",
    "gim_schema/__init__.py",
    "utils",
    "output_plugins/category_data_csv_output",
    "output_plugins/json_console_output",
    "output_plugins/json_file_output",
    "output_plugins/message_summaries_output",
    "output_plugins/sample_plaintext_output",
    "output_plugins/madcap_html_output",
    "tests/test_base_output.py",
    "tests/test_category_csv_*.py",
    "tests/test_config_loader_*.py",
    "tests/test_field_schema_model.py",
    "tests/test_json_output.py",
    "tests/test_msg_summaries_output.py",
    "tests/test_runner_*.py",
    "tests/test_sample_plaintext_output.py",
    "tests/test_utils_*.py",
    "tests/output_madcap",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "D", "Q", "B", "SIM"]
ignore = ["D200", "D203", "D212", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["."]
mypy_path = "."
explicit_package_bases = true

# Same grandfathering as ruff above, expressed as mypy overrides.
[[tool.mypy.overrides]]
module = [
    "main", "runner", "config_loader", "plugin_loader", "base_output",
    "gim_schema.atomic_fields", "gim_schema.field_schema_model",
    "gim_schema.full_schema", "gim_schema.plugin_config_schema", "gim_schema",
    "utils.*",
    "output_plugins.category_data_csv_output.*",
    "output_plugins.json_console_output.*",
    "output_plugins.json_file_output.*",
    "output_plugins.message_summaries_output.*",
    "output_plugins.sample_plaintext_output.*",
    "output_plugins.madcap_html_output.*",
    "tests.test_base_output",
    "tests.test_category_csv_missing_category_data",
    "tests.test_category_csv_missing_event_data",
    "tests.test_category_csv_missing_gim_type",
    "tests.test_category_csv_missing_subcat_data",
    "tests.test_category_csv_valid_path",
    "tests.test_config_loader_field_schema_parsing",
    "tests.test_field_schema_model",
    "tests.test_json_output",
    "tests.test_msg_summaries_output",
    "tests.test_runner_ensure_output_dir",
    "tests.test_runner_load_and_transform_gim_config",
    "tests.test_runner_load_config",
    "tests.test_runner_run_build",
    "tests.test_runner_run_plugins",
    "tests.test_runner_scan_and_import_plugins",
    "tests.test_runner_script_config",
    "tests.test_sample_plaintext_output",
    "tests.test_utils_file_write",
    "tests.test_utils_sanitize",
    "tests.output_madcap.*",
]
ignore_errors = true
